<!doctype html>
<html lang="es"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Registro | TecnoNova</title><link rel="stylesheet" href="css/styles.css" /></head>
<body><header class="topbar"><a class="brand" href="index.html">TecnoNova</a><nav aria-label="Navegación principal"><ul class="nav-list"><li><a href="index.html">Inicio</a></li><li><a href="productos.html">Productos</a></li><li><a aria-current="page" href="registro.html">Registro</a></li><li><a href="ingreso.html">Ingresar</a></li><li><a href="contacto.html">Contacto</a></li></ul></nav></header>
<main class="page-main"><section class="form-card" aria-labelledby="titulo-registro"><p class="eyebrow">Nueva cuenta</p><h1 id="titulo-registro">Crea tu cuenta</h1><p>Los campos con * son obligatorios.</p><form id="formulario-registro" novalidate>
<div class="field"><label for="nombre">Nombre *</label><input id="nombre" name="nombre" type="text" autocomplete="given-name" aria-describedby="error-nombre" /><p id="error-nombre" class="error" role="alert"></p></div>
<div class="field"><label for="apellidos">Apellidos *</label><input id="apellidos" name="apellidos" type="text" autocomplete="family-name" aria-describedby="error-apellidos" /><p id="error-apellidos" class="error" role="alert"></p></div>
<div class="field"><label for="correo">Correo electrónico *</label><input id="correo" name="correo" type="email" autocomplete="email" placeholder="nombre@correo.cl" aria-describedby="error-correo" /><p id="error-correo" class="error" role="alert"></p></div>
<div class="field"><label for="contrasena">Contraseña *</label><input id="contrasena" name="contrasena" type="password" autocomplete="new-password" aria-describedby="ayuda-contrasena error-contrasena" /><p id="ayuda-contrasena" class="hint">Mínimo 8 caracteres.</p><p id="error-contrasena" class="error" role="alert"></p></div>
<div class="field checkbox"><input id="terminos" name="terminos" type="checkbox" aria-describedby="error-terminos" /><label for="terminos">Acepto los términos y condiciones *</label><p id="error-terminos" class="error" role="alert"></p></div><button class="btn-primary" type="submit">Crear cuenta</button></form><p id="resultado-registro" class="success-message" tabindex="-1" aria-live="polite"></p></section></main>
<footer><p><strong>TecnoNova</strong> · Tecnología simple y confiable.</p><p>¿Ya tienes cuenta? <a href="ingreso.html">Ingresa aquí</a>.</p><p>© 2026 TecnoNova.</p></footer><script type="module" src="js/registro.js"></script></body></html>
